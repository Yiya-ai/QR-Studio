# Include inside an existing HTTPS server block.
location = /qr-studio {
    return 301 /qr-studio/;
}

location ^~ /qr-studio/ {
    alias /opt/qr-studio/current/;
    index index.html;
    autoindex off;
    access_log off;
    client_max_body_size 1k;

    # Only the build's public assets are reachable. No SPA fallback.
    if ($uri !~ "^/qr-studio/(index\.html|styles\.css|app\.js|studio\.js|studio-core\.js|THIRD_PARTY_NOTICES\.md|vendor/(qrcodegen\.js|jsqr\.js|jsqr\.LICENSE\.txt))?$") {
        return 404;
    }
    if ($request_method !~ "^(GET|HEAD)$") {
        return 405;
    }

    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
